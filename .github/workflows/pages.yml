name: Publish control.repay.sa frontend
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: Verified HTTPS origin of the separately deployed RePayControl API
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-pages.mjs
        env:
          CONTROL_API_ORIGIN: ${{ inputs.api_origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
