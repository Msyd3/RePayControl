<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Data Room | RePay</title><link rel="icon" href="/assets/repay-logo.png"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/dataroom/room.css"><script src="/dataroom/room.js" defer></script></head><body><section id="room-login" class="login-screen"><div class="login-card"><img class="login-logo" src="/assets/repay-logo.png" alt="RePay"><h1 class="room-heading" dir="ltr">Data Room</h1><form id="room-form"><label for="email">أدخل بريدك الإلكتروني</label><input id="email" type="email" dir="ltr" autocomplete="email" placeholder="name@company.com" required><button class="primary" type="submit">دخول</button><p class="room-note">نسخة معاينة فقط — لا تحتوي على مستندات سرية أو تحقق فعلي من البريد.</p></form></div></section><main id="room-app" hidden><div class="page-title"><h1 dir="ltr">Data Room</h1><button id="room-logout" class="primary">تسجيل الخروج</button></div><div class="toolbar"><span class="room-note">Private &amp; Confidential · Preview</span><span id="room-email" dir="ltr"></span></div><section id="folder-list"><div class="section-line"><h2>المجلدات <span class="count" id="folder-count">14</span></h2><input id="folder-search" class="search" type="search" placeholder="Search folders..." aria-label="Search folders" dir="ltr"></div><div id="folders" class="room-grid"></div><p id="no-results" hidden>لا توجد نتائج</p></section><section id="folder-detail" hidden><div class="section-line"><h2 id="folder-title" dir="ltr"></h2><button id="folder-back" class="primary">العودة للمجلدات</button></div><div class="panel room-empty">لا توجد مستندات حتى الآن</div></section><div class="bottom-line"><span>RePay · Private &amp; Confidential</span></div></main></body></html>
