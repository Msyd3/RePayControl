<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>نظرة عامة | RePayControl</title><link rel="icon" href="/assets/repay-logo.png" type="image/png"><link rel="stylesheet" href="/styles.css"><script src="/runtime-config.js" defer></script><script src="/control-entry.js" defer></script><script src="/dashboard.js?v=full-sidebar-1" defer></script></head>
<body>
<section id="login-screen" class="login-screen" hidden><div class="login-card"><img class="login-logo" src="/assets/repay-logo.png" width="82" height="82" alt="RePay"><form id="login-form"><label for="login-email">البريد الإلكتروني</label><input id="login-email" type="email" dir="ltr" autocomplete="username" required><div id="login-password-field" hidden><label for="password">كلمة المرور</label><input id="password" type="password" dir="ltr" inputmode="numeric" autocomplete="current-password"></div><button class="primary" type="submit">دخول</button><p id="login-error" role="alert"></p></form></div></section>
<div id="control-layout" class="control-layout" hidden>
<aside class="control-sidebar">
  <img src="/assets/repay-logo.png" alt="RePay" width="52" height="52">
  <button class="sidebar-toggle" type="button" aria-label="القائمة" aria-expanded="false" aria-controls="sidebar-panel"><span aria-hidden="true"></span></button>
  <div id="sidebar-panel" class="sidebar-panel">
  <nav aria-label="أقسام ري باي">
    <a href="/" aria-current="page">الرئيسية</a>
    <a href="/dataroom/" data-roles="admin viewer">غرفة البيانات</a>
    <button type="button" id="open-invites" data-roles="admin">الدعوات</button>
  </nav>
  <div class="sidebar-bottom"><button type="button" id="logout">تسجيل الخروج</button></div>
  </div>
</aside>
<main id="app" hidden>
  <div class="page-title"><h1>نظرة عامة</h1><button id="export" class="primary export-button"><span aria-hidden="true">↓</span> تصدير PDF</button></div>
  <div class="toolbar"><div class="toolbar-status"><span id="sync-status">جارٍ التحميل</span></div></div>
  <div id="load-error" class="notice" role="alert" hidden></div>
  <section id="content" aria-live="polite"></section>
</main>
</div>
<div id="toast" role="status" class="toast" hidden></div>
<dialog id="avatar-picker" aria-labelledby="avatar-picker-title">
  <h2 id="avatar-picker-title" tabindex="-1" autofocus>تغيير الميموجي</h2>
  <div id="avatar-options" class="avatar-options"></div>
  <p id="avatar-error" role="alert"></p>
  <button type="button" id="avatar-cancel">إلغاء</button>
</dialog>
</body></html>
